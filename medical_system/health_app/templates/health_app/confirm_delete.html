{% extends "health_app/base.html" %}
{% block title %}Confirm Delete{% endblock %}
{% block page_title %}🗑️ Confirm Delete{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;">
    <p style="font-size:1rem; margin-bottom:16px;">
        Are you sure you want to delete this <strong>{{ type }}</strong>?<br>
        <strong>{{ object }}</strong>
    </p>
    <p style="color:var(--danger); font-size:0.88rem; margin-bottom:20px;">⚠️ This action cannot be undone.</p>
    <form method="post" style="display:flex; gap:10px;">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="javascript:history.back()" class="btn btn-outline">Cancel</a>
    </form>
</div>
{% endblock %}
